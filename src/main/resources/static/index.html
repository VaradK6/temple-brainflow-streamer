<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Temple BrainFlow — Live Biometric Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
    body { background: #0B0F19; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1E293B; padding-bottom: 16px; margin-bottom: 24px; }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .title span { color: #0D9488; }
    .badge { padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; text-transform: uppercase; background: #0D948833; color: #2DD4BF; border: 1px solid #0D9488; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .card { background: #131B2E; border: 1px solid #1E293B; border-radius: 12px; padding: 18px; }
    .card-label { font-size: 11px; text-transform: uppercase; color: #94A3B8; font-weight: 600; margin-bottom: 6px; }
    .card-val { font-size: 28px; font-weight: 700; color: #FFFFFF; }
    .card-sub { font-size: 12px; color: #64748B; margin-top: 4px; }
    .chart-container { background: #131B2E; border: 1px solid #1E293B; border-radius: 12px; padding: 20px; height: 380px; }
  </style>
</head>
<body>
<div class="header">
    <div class="title">TEMPLE <span>BRAINFLOW™</span> // TELEMETRY MONITOR</div>
    <div id="statusBadge" class="badge">CONNECTING TO DEVICE...</div>
</div>

<div class="cards">
    <div class="card">
        <div class="card-label">Cerebral Perfusion Index</div>
        <div id="perfusionVal" class="card-val">--</div>
        <div class="card-sub">Prefrontal blood flow rate</div>
    </div>
    <div class="card">
        <div class="card-label">Autonomic Entropy</div>
        <div id="entropyVal" class="card-val">--</div>
        <div class="card-sub">Sympathetic nervous tension</div>
    </div>
    <div class="card">
        <div class="card-label">Pulse Transit Time (PTT)</div>
        <div id="pttVal" class="card-val">-- ms</div>
        <div class="card-sub">Vascular elasticity metric</div>
    </div>
    <div class="card">
        <div class="card-label">Brain State</div>
        <div id="stateVal" class="card-val">OPTIMAL</div>
        <div class="card-sub">Real-time classification</div>
    </div>
</div>

<div class="chart-container">
    <canvas id="telemetryChart"></canvas>
</div>

<script>
    const ctx = document.getElementById('telemetryChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Cerebral Perfusion Index',
            data: [],
            borderColor: '#0D9488',
            backgroundColor: 'rgba(13, 148, 136, 0.1)',
            fill: true,
            tension: 0.35,
            borderWidth: 2
          },
          {
            label: 'Entropy Score (Scaled x100)',
            data: [],
            borderColor: '#F43F5E',
            borderDash: [5, 5],
            tension: 0.35,
            borderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { grid: { color: '#1E293B' }, ticks: { color: '#64748B' } },
          y: { grid: { color: '#1E293B' }, ticks: { color: '#64748B' }, min: 0, max: 100 }
        },
        plugins: { legend: { labels: { color: '#94A3B8' } } }
      }
    });

    const evtSource = new EventSource('/api/v1/telemetry/stream/DEVICE-TMPL-882');
    evtSource.addEventListener('brainflow-packet', (e) => {
      const data = JSON.parse(e.data);
      document.getElementById('statusBadge').innerText = 'LIVE STREAM ACTIVE';
      document.getElementById('perfusionVal').innerText = data.cerebralPerfusionIndex.toFixed(1);
      document.getElementById('entropyVal').innerText = data.autonomicEntropyScore.toFixed(3);
      document.getElementById('pttVal').innerText = data.pulseTransitTimeMs.toFixed(1) + ' ms';
      document.getElementById('stateVal').innerText = data.state;

      const timeLabel = new Date(data.timestamp).toLocaleTimeString();
      if (chart.data.labels.length > 25) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
        chart.data.datasets[1].data.shift();
      }
      chart.data.labels.push(timeLabel);
      chart.data.datasets[0].data.push(data.cerebralPerfusionIndex);
      chart.data.datasets[1].data.push(data.autonomicEntropyScore * 100);
      chart.update('none');
    });
  </script>
</body>
</html>
